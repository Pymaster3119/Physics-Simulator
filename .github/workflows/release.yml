name: Create Executable

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Executible - ${{ matrix.platform.release_for }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - release_for: Linux-x86_64
            os: ubuntu-latest
            pyinstaller_target: linux
            bin: simulation
            name: simulation-linux-amd64

          - release_for: Windows-x86_64
            os: windows-latest
            pyinstaller_target: windows
            bin: simulation.exe
            name: simulation-windows-amd64.exe

          - release_for: macOS-x86_64
            os: macos-latest
            pyinstaller_target: macos
            bin: simulation
            name: simulation-macos-amd64

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.6'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable
        run: |
          pyinstaller --onefile main.py
        working-directory: .

      - name: Prepare assets
        shell: bash
        run: |
          mkdir -p release

          cp dist/main* release/${{ matrix.platform.name }}

      - name: Upload binaries to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/${{ matrix.platform.name }}
          asset_name: ${{ matrix.platform.name }}
          tag: ${{ github.ref }}
          overwrite: true